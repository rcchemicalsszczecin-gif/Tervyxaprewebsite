      - name: Submit sitemap URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          KEY='1fac488a605d166e281f2e07a72e0957'
          KEY_LOCATION='https://tervyxa.pl/1fac488a605d166e281f2e07a72e0957.txt'
          python3 - <<'PY' >/tmp/urls
          import xml.etree.ElementTree as ET
          root=ET.parse('sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          for n in root.findall('s:url/s:loc',ns): print(n.text)
          PY
          while IFS= read -r URL; do
            CODE="$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' --get 'https://www.bing.com/indexnow' --data-urlencode "url=${URL}" --data-urlencode "key=${KEY}" --data-urlencode "keyLocation=${KEY_LOCATION}")"
            echo "${URL} -> ${CODE}"
            test "${CODE}" = 200 -o "${CODE}" = 202
          done </tmp/urls
