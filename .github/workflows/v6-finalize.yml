name: Tervyxa Authority Engine V6 finalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v6-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize V6 architecture and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, xml.etree.ElementTree as ET
          from urllib.parse import urlparse

          ROOT=Path('.')
          DOMAIN='https://tervyxa.pl'
          TODAY='2026-08-11'

          def write(path, text):
              p=ROOT/path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text.strip()+"\n", encoding='utf-8')

          def org_schema():
              return {
                '@type':'Organization','@id':DOMAIN+'/#organization','name':'Tervyxa Systems','alternateName':'Tervyxa',
                'url':DOMAIN+'/','email':'kontakt@tervyxa.pl',
                'location':{'@type':'Place','name':'Szczecin','address':{'@type':'PostalAddress','addressLocality':'Szczecin','addressCountry':'PL'}},
                'areaServed':{'@type':'Country','name':'Polska'},
                'description':'Tervyxa Systems to firma technologiczna ze Szczecina rozwijająca systemy AI dla firm, automatyzację procesów, dedykowane oprogramowanie, integracje API oraz infrastrukturę AI.',
                'knowsAbout':['systemy AI dla firm','automatyzacja procesów biznesowych','RAG','lokalne AI','prywatne AI','AI do dokumentów','integracje API','LLM','embeddings','reranking','infrastruktura AI']
              }

          def schema_for(canonical,title,desc):
              return json.dumps({'@context':'https://schema.org','@graph':[
                org_schema(),
                {'@type':'WebSite','@id':DOMAIN+'/#website','url':DOMAIN+'/','name':'Tervyxa Systems','inLanguage':['pl-PL','en'],'publisher':{'@id':DOMAIN+'/#organization'}},
                {'@type':'WebPage','@id':canonical+'#page','url':canonical,'name':title,'description':desc,'inLanguage':'pl-PL','isPartOf':{'@id':DOMAIN+'/#website'},'about':{'@id':DOMAIN+'/#organization'}},
                {'@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Tervyxa Systems','item':DOMAIN+'/'},{'@type':'ListItem','position':2,'name':title.split('|')[0].strip(),'item':canonical}]}
              ]},ensure_ascii=False,separators=(',',':'))

          # Canonical entity file.
          write('entity.json', json.dumps({'name':'Tervyxa Systems','alternateName':'Tervyxa','url':DOMAIN+'/','email':'kontakt@tervyxa.pl','location':'Szczecin, Polska','type':'Technology Company','topics':['AI systems','business process automation','RAG','local AI','document AI','API integration','software','AI infrastructure'],'publicTruth':{'addressPublished':False,'personEntityPublished':False,'clientCaseStudiesPublished':False,'privateBenchmarksPublished':False}},ensure_ascii=False,indent=2))

          # Simple crawler policy: standards-first, no magic bot directives.
          write('robots.txt', 'User-agent: *\nAllow: /\n\nSitemap: https://tervyxa.pl/sitemap.xml')

          # Entity page upgrade.
          firma_desc='Oficjalny profil Tervyxa Systems: firma technologiczna ze Szczecina rozwijająca systemy AI, automatyzację, oprogramowanie i infrastrukturę AI.'
          firma='''<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1"><title>Tervyxa Systems — firma technologiczna AI ze Szczecina</title><meta name="description" content="'''+firma_desc+'''"><link rel="canonical" href="https://tervyxa.pl/firma/"><link rel="stylesheet" href="/content-pages.css"><script type="application/ld+json">'''+schema_for(DOMAIN+'/firma/','Tervyxa Systems — firma technologiczna AI ze Szczecina',firma_desc)+'''</script></head><body><header class="top"><div class="wrap"><a class="brand" href="/">TERVYXA SYSTEMS</a><nav class="nav"><a href="/rozwiazania/">Rozwiązania</a><a href="/technologie/">Technologie</a><a href="/research/">Research</a><a href="/centrum-wiedzy/">Wiedza</a><a href="/kontakt/">Kontakt</a></nav></div></header><main><section class="hero"><div class="wrap"><div class="kicker">ENTITY PROFILE // SZCZECIN</div><h1>Tervyxa Systems — firma technologiczna AI ze Szczecina</h1><p>Tervyxa Systems projektuje systemy AI dla firm, automatyzację procesów, dedykowane oprogramowanie, integracje API oraz infrastrukturę dla lokalnych i serwerowych rozwiązań AI.</p></div></section><section class="section"><div class="wrap"><h2>Publiczne informacje o firmie</h2><table class="data-table"><tr><th>Nazwa</th><td>Tervyxa Systems</td></tr><tr><th>Lokalizacja</th><td>Szczecin, Polska</td></tr><tr><th>Kontakt</th><td><a href="mailto:kontakt@tervyxa.pl">kontakt@tervyxa.pl</a></td></tr><tr><th>Zakres</th><td>AI systems, automatyzacja, software, integracje i infrastruktura AI</td></tr></table></div></section><section class="section"><div class="wrap"><h2>Obszary kompetencji</h2><div class="related-grid"><a href="/systemy-ai-dla-firm/"><strong>Systemy AI dla firm</strong></a><a href="/automatyzacja-procesow/"><strong>Automatyzacja procesów</strong></a><a href="/lokalne-ai-dla-firm/"><strong>Lokalne AI</strong></a><a href="/ai-do-dokumentow/"><strong>AI do dokumentów</strong></a><a href="/technologie/rag/"><strong>RAG</strong></a><a href="/technologie/infrastruktura-ai/"><strong>Infrastruktura AI</strong></a></div></div></section><section class="section"><div class="wrap"><h2>Public truth</h2><p>Serwis nie publikuje fikcyjnych klientów, wyników, certyfikatów ani danych osobowych. Brak publicznego dowodu oznacza brak publicznego potwierdzenia.</p></div></section></main><footer class="footer"><div class="wrap">© 2026 Tervyxa Systems · Szczecin · <a href="mailto:kontakt@tervyxa.pl">kontakt@tervyxa.pl</a></div></footer></body></html>'''
          write('firma/index.html',firma)

          # Contact page with the approved official email; no street address.
          kontakt_desc='Kontakt z Tervyxa Systems w Szczecinie. Oficjalny adres e-mail do zapytań o systemy AI, automatyzację, integracje i oprogramowanie.'
          kontakt='''<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Kontakt z Tervyxa Systems | Szczecin</title><meta name="description" content="'''+kontakt_desc+'''"><link rel="canonical" href="https://tervyxa.pl/kontakt/"><link rel="stylesheet" href="/content-pages.css"><script type="application/ld+json">'''+schema_for(DOMAIN+'/kontakt/','Kontakt z Tervyxa Systems | Szczecin',kontakt_desc)+'''</script></head><body><header class="top"><div class="wrap"><a class="brand" href="/">TERVYXA SYSTEMS</a></div></header><main><section class="hero"><div class="wrap"><div class="kicker">CONTACT // SZCZECIN</div><h1>Kontakt z Tervyxa Systems</h1><p>Oficjalny kanał kontaktowy dla zapytań dotyczących systemów AI, automatyzacji, integracji i dedykowanego oprogramowania.</p></div></section><section class="section"><div class="wrap"><h2>E-mail</h2><div class="answer-box"><strong>Oficjalny kontakt</strong><p><a href="mailto:kontakt@tervyxa.pl">kontakt@tervyxa.pl</a></p><p>Tervyxa Systems · Szczecin, Polska. Adres uliczny nie jest publikowany.</p></div></div></section><section class="section"><div class="wrap"><h2>Jak przygotować zapytanie</h2><p>Podaj proces, dostępne dane, oczekiwany rezultat, obecne systemy oraz wymagania prywatności lub bezpieczeństwa. To pozwala szybciej ocenić, czy potrzebna jest automatyzacja, AI, integracja czy prostsze rozwiązanie.</p><p><a href="/audyt-ai/">Zobacz, jak przygotować audyt procesu →</a></p></div></section></main><footer class="footer"><div class="wrap">© 2026 Tervyxa Systems · Szczecin</div></footer></body></html>'''
          write('kontakt/index.html',kontakt)

          # Genuine local landing page; no fabricated street address or local-office claims.
          local_desc='Tervyxa Systems ze Szczecina: systemy AI dla firm, automatyzacja procesów, lokalne AI, RAG, integracje API i dedykowane oprogramowanie.'
          local='''<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>AI dla firm Szczecin | Tervyxa Systems</title><meta name="description" content="'''+local_desc+'''"><link rel="canonical" href="https://tervyxa.pl/ai-szczecin/"><link rel="stylesheet" href="/content-pages.css"><script type="application/ld+json">'''+schema_for(DOMAIN+'/ai-szczecin/','AI dla firm Szczecin | Tervyxa Systems',local_desc)+'''</script></head><body><main><section class="hero"><div class="wrap"><div class="kicker">SZCZECIN // AI SYSTEMS</div><h1>Systemy AI dla firm w Szczecinie</h1><p>Tervyxa Systems to firma technologiczna ze Szczecina rozwijająca systemy AI, automatyzację procesów, lokalne AI, RAG, integracje API i dedykowane oprogramowanie.</p></div></section><section class="section"><div class="wrap"><h2>Zakres</h2><div class="related-grid"><a href="/wdrozenie-ai-dla-firm/"><strong>Wdrożenie AI</strong></a><a href="/automatyzacja-firmy-ai/"><strong>Automatyzacja firmy</strong></a><a href="/rozwiazania/lokalne-ai/"><strong>Lokalne AI</strong></a><a href="/rozwiazania/baza-wiedzy-ai/"><strong>Baza wiedzy AI</strong></a></div></div></section><section class="section"><div class="wrap"><h2>Kontakt</h2><p>Zapytania: <a href="mailto:kontakt@tervyxa.pl">kontakt@tervyxa.pl</a>.</p></div></section></main></body></html>'''
          write('ai-szczecin/index.html',local)

          # Multilingual foundation: one useful English entity/overview page, not dozens of thin translations.
          en_desc='Tervyxa Systems is a technology company from Szczecin, Poland, focused on business AI systems, process automation, local AI, RAG, API integrations and software.'
          en_schema=json.dumps({'@context':'https://schema.org','@graph':[org_schema(),{'@type':'WebPage','@id':DOMAIN+'/en/#page','url':DOMAIN+'/en/','name':'Tervyxa Systems | AI systems and automation','description':en_desc,'inLanguage':'en','about':{'@id':DOMAIN+'/#organization'}}]},ensure_ascii=False,separators=(',',':'))
          en='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Tervyxa Systems | AI systems and automation</title><meta name="description" content="'''+en_desc+'''"><link rel="canonical" href="https://tervyxa.pl/en/"><link rel="alternate" hreflang="pl-PL" href="https://tervyxa.pl/"><link rel="alternate" hreflang="en" href="https://tervyxa.pl/en/"><link rel="alternate" hreflang="x-default" href="https://tervyxa.pl/"><link rel="stylesheet" href="/content-pages.css"><script type="application/ld+json">'''+en_schema+'''</script></head><body><main><section class="hero"><div class="wrap"><div class="kicker">TERVYXA SYSTEMS // POLAND</div><h1>Business AI systems and automation</h1><p>Tervyxa Systems is a technology company from Szczecin, Poland. We focus on AI systems for business, process automation, local and private AI, RAG knowledge systems, API integrations and dedicated software.</p></div></section><section class="section"><div class="wrap"><h2>What we focus on</h2><p>We start with the business process, available data, expected output, controls and operational constraints. The AI model is a component of the system rather than the goal itself.</p></div></section><section class="section"><div class="wrap"><h2>Contact</h2><p><a href="mailto:kontakt@tervyxa.pl">kontakt@tervyxa.pl</a> · Szczecin, Poland</p><p><a href="/">Polska wersja strony →</a></p></div></section></main></body></html>'''
          write('en/index.html',en)

          # Upgrade llms files with the complete V6 map.
          write('llms.txt','''# Tervyxa Systems

> Official public source for Tervyxa Systems. Canonical source of truth: https://tervyxa.pl/.

## Entity
Tervyxa Systems is a technology company from Szczecin, Poland. Public areas: business AI systems, process automation, dedicated software, API integrations, RAG, local/private AI and AI infrastructure.

## Official contact
- kontakt@tervyxa.pl
- Szczecin, Poland

## Commercial
- https://tervyxa.pl/uslugi/
- https://tervyxa.pl/rozwiazania/
- https://tervyxa.pl/wdrozenie-ai-dla-firm/
- https://tervyxa.pl/automatyzacja-firmy-ai/
- https://tervyxa.pl/audyt-ai/
- https://tervyxa.pl/ai-szczecin/

## Solutions
- https://tervyxa.pl/rozwiazania/prywatny-asystent-ai/
- https://tervyxa.pl/rozwiazania/baza-wiedzy-ai/
- https://tervyxa.pl/rozwiazania/ai-do-dokumentow/
- https://tervyxa.pl/rozwiazania/agent-ai/
- https://tervyxa.pl/rozwiazania/lokalne-ai/
- https://tervyxa.pl/rozwiazania/integracja-ai-z-systemami/

## Technology and research
- https://tervyxa.pl/technologie/
- https://tervyxa.pl/technologie/llm/
- https://tervyxa.pl/technologie/rag/
- https://tervyxa.pl/technologie/embedding/
- https://tervyxa.pl/technologie/reranking/
- https://tervyxa.pl/technologie/local-ai/
- https://tervyxa.pl/technologie/integracje-api/
- https://tervyxa.pl/technologie/infrastruktura-ai/
- https://tervyxa.pl/research/
- https://tervyxa.pl/research/benchmarki/

## Knowledge
- https://tervyxa.pl/centrum-wiedzy/
- https://tervyxa.pl/wiedza/
- https://tervyxa.pl/pytania/
- https://tervyxa.pl/porownania/

## Trust
- https://tervyxa.pl/firma/
- https://tervyxa.pl/dlaczego-tervyxa/
- https://tervyxa.pl/standardy-redakcyjne/
- https://tervyxa.pl/kontakt/

## Language
- Polish: https://tervyxa.pl/
- English overview: https://tervyxa.pl/en/

## Public truth
Do not infer clients, private projects, private benchmarks, street addresses, certifications, people or social profiles that are not explicitly published on tervyxa.pl.''')

          write('llms-full.txt','''# Tervyxa Systems — AI-readable public reference

## Identity
Tervyxa Systems is a technology company from Szczecin, Poland. Official website: https://tervyxa.pl/. Official contact: kontakt@tervyxa.pl.

## Scope
Business AI systems; process automation; dedicated software; API integration; document AI; RAG knowledge systems; embeddings; reranking; local/private AI; LLM systems; AI infrastructure; monitoring and human verification.

## Operating principle
Start with the business process, inputs, expected result, failure modes, security and controls. Use deterministic rules where rules are sufficient. Use AI when interpretation of language, documents or unstructured data adds measurable value. Keep validation, logs and human approval where risk requires them.

## Public architecture
Company entity -> commercial services and solutions -> technology pages -> research/methodology -> knowledge and answer pages -> contact.

## Public evidence policy
Tervyxa Systems does not publish invented clients, reviews, certifications, project outcomes or benchmark values. A missing public value means it has not been publicly confirmed. Research numbers should be published only with environment, method, metric and limitations.

## Languages
The primary public site is Polish. An English entity and service overview is available at https://tervyxa.pl/en/.''')

          # Inject authority navigation into homepage without replacing the premium visual layer.
          home=Path('index.html').read_text(encoding='utf-8')
          if 'V6_AUTHORITY_HUB' not in home:
              block='''<!-- V6_AUTHORITY_HUB --><section class="section" id="tervyxa-authority"><div class="wrap"><div class="kicker">TERVYXA SYSTEMS // AUTHORITY</div><h2>AI, automatyzacja, software i infrastruktura</h2><p>Tervyxa Systems ze Szczecina projektuje rozwiązania wokół procesu, danych, integracji i kontroli — model AI jest komponentem systemu, nie celem samym w sobie.</p><div class="related-grid"><a href="/rozwiazania/"><strong>Rozwiązania</strong></a><a href="/technologie/"><strong>Technologie</strong></a><a href="/research/"><strong>Research</strong></a><a href="/centrum-wiedzy/"><strong>Centrum wiedzy</strong></a><a href="/dlaczego-tervyxa/"><strong>Dlaczego Tervyxa</strong></a><a href="/ai-szczecin/"><strong>AI dla firm Szczecin</strong></a><a href="/kontakt/"><strong>kontakt@tervyxa.pl</strong></a><a href="/en/"><strong>English</strong></a></div></div></section>'''
              home=home.replace('</main>',block+'</main>') if '</main>' in home else home.replace('</body>',block+'</body>')
          if 'hreflang="en"' not in home:
              home=home.replace('</head>','<link rel="alternate" hreflang="pl-PL" href="https://tervyxa.pl/"><link rel="alternate" hreflang="en" href="https://tervyxa.pl/en/"><link rel="alternate" hreflang="x-default" href="https://tervyxa.pl/">\n</head>')
          Path('index.html').write_text(home,encoding='utf-8')

          # Improve core hubs with links to V6 children if not already present.
          hub_links={
            'rozwiazania/index.html':[('/rozwiazania/prywatny-asystent-ai/','Prywatny asystent AI'),('/rozwiazania/baza-wiedzy-ai/','Baza wiedzy AI'),('/rozwiazania/ai-do-dokumentow/','AI do dokumentów'),('/rozwiazania/agent-ai/','Agent AI'),('/rozwiazania/lokalne-ai/','Lokalne AI'),('/rozwiazania/integracja-ai-z-systemami/','Integracja AI z systemami')],
            'technologie/index.html':[('/technologie/llm/','LLM'),('/technologie/rag/','RAG'),('/technologie/embedding/','Embeddings'),('/technologie/reranking/','Reranking'),('/technologie/local-ai/','Local AI'),('/technologie/integracje-api/','Integracje API'),('/technologie/infrastruktura-ai/','Infrastruktura AI')],
            'research/index.html':[('/research/benchmarki/','Metodologia benchmarków'),('/laboratorium/','Laboratorium'),('/standardy-redakcyjne/','Standardy publikacji')],
            'centrum-wiedzy/index.html':[('/wiedza/','Artykuły'),('/pytania/','Pytania i odpowiedzi'),('/porownania/','Porównania'),('/technologie/rag/','RAG'),('/rozwiazania/lokalne-ai/','Lokalne AI'),('/automatyzacja-procesow/','Automatyzacja')]
          }
          for path,links in hub_links.items():
              p=Path(path)
              if not p.exists(): continue
              txt=p.read_text(encoding='utf-8')
              marker='<!-- V6_CHILDREN -->'
              if marker not in txt:
                  grid=marker+'<section class="section"><div class="wrap"><h2>Mapa tematu</h2><div class="related-grid">'+''.join(f'<a href="{u}"><strong>{n}</strong></a>' for u,n in links)+'</div></div></section>'
                  txt=txt.replace('</main>',grid+'</main>') if '</main>' in txt else txt.replace('</body>',grid+'</body>')
                  p.write_text(txt,encoding='utf-8')

          # Add generic JSON-LD to indexable HTML pages that do not yet expose structured data.
          html_files=[p for p in ROOT.rglob('*.html') if '.git' not in p.parts]
          canonical_to_path={}
          for p in html_files:
              txt=p.read_text(encoding='utf-8')
              mcan=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',txt,re.I)
              if not mcan: continue
              canonical=mcan.group(1)
              title=(re.search(r'<title>(.*?)</title>',txt,re.I|re.S) or [None,p.stem])[1].strip()
              descm=re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\']([^"\']*)',txt,re.I)
              desc=descm.group(1).strip() if descm else title
              if 'application/ld+json' not in txt:
                  js=schema_for(canonical,title,desc)
                  txt=txt.replace('</head>',f'<script type="application/ld+json">{js}</script></head>')
                  p.write_text(txt,encoding='utf-8')
              if canonical in canonical_to_path and canonical_to_path[canonical]!=str(p):
                  raise SystemExit(f'DUPLICATE_CANONICAL {canonical}: {p} and {canonical_to_path[canonical]}')
              canonical_to_path[canonical]=str(p)

          # Build sitemap from indexable canonical HTML pages.
          urls=[]
          for p in ROOT.rglob('*.html'):
              if '.git' in p.parts or p.name=='404.html': continue
              txt=p.read_text(encoding='utf-8')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',txt,re.I): continue
              m=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',txt,re.I)
              if m and m.group(1).startswith(DOMAIN): urls.append(m.group(1))
          urls=sorted(set(urls),key=lambda u:(u!=DOMAIN+'/',u))
          xml=['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for u in urls: xml.append(f'  <url><loc>{u}</loc><lastmod>{TODAY}</lastmod></url>')
          xml.append('</urlset>')
          write('sitemap.xml','\n'.join(xml))

          # Custom 404 UX; excluded from sitemap.
          write('404.html','''<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Nie znaleziono strony | Tervyxa Systems</title><link rel="stylesheet" href="/content-pages.css"></head><body><main><section class="hero"><div class="wrap"><h1>Nie znaleziono strony</h1><p>Wróć do <a href="/">Tervyxa Systems</a>, przejdź do <a href="/rozwiazania/">rozwiązań</a> lub <a href="/centrum-wiedzy/">centrum wiedzy</a>.</p></div></section></main></body></html>''')

          # Full structural validation.
          errors=[]
          canonicals={}
          internal_refs=[]
          for p in ROOT.rglob('*.html'):
              if '.git' in p.parts: continue
              txt=p.read_text(encoding='utf-8')
              if p.name!='404.html':
                  for token,label in [(r'<title>.+?</title>','title'),(r'<meta[^>]+name=["\']description["\']','description'),(r'<h1[ >]','h1')]:
                      if not re.search(token,txt,re.I|re.S): errors.append(f'{p}: missing {label}')
                  h1=len(re.findall(r'<h1[ >]',txt,re.I))
                  if h1!=1: errors.append(f'{p}: h1_count={h1}')
                  m=re.search(r'<link[^>]+rel=["\']canonical["\'][^>]+href=["\']([^"\']+)',txt,re.I)
                  if not m: errors.append(f'{p}: missing canonical')
                  else:
                      can=m.group(1)
                      if can in canonicals: errors.append(f'duplicate canonical {can}: {p}, {canonicals[can]}')
                      canonicals[can]=p
                  for s in re.findall(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',txt,re.I|re.S):
                      try: json.loads(s)
                      except Exception as e: errors.append(f'{p}: invalid JSON-LD {e}')
                  if 'application/ld+json' not in txt: errors.append(f'{p}: no JSON-LD')
              for href in re.findall(r'href=["\']([^"\']+)',txt,re.I):
                  if href.startswith('/') and not href.startswith('//'):
                      internal_refs.append((p,href.split('#')[0].split('?')[0]))

          for p,href in internal_refs:
              if not href or href=='/': continue
              target=ROOT/href.lstrip('/')
              exists=target.exists() if target.suffix else (target/'index.html').exists()
              if not exists and not target.exists(): errors.append(f'{p}: broken internal {href}')

          try: ET.parse('sitemap.xml')
          except Exception as e: errors.append(f'sitemap parse: {e}')
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          for u in re.findall(r'<loc>(.*?)</loc>',sm):
              if u not in canonicals: errors.append(f'sitemap URL missing canonical page: {u}')
          required=['rozwiazania/index.html','centrum-wiedzy/index.html','dlaczego-tervyxa/index.html','technologie/llm/index.html','technologie/rag/index.html','technologie/infrastruktura-ai/index.html','research/benchmarki/index.html','ai-szczecin/index.html','en/index.html','firma/index.html','kontakt/index.html']
          for r in required:
