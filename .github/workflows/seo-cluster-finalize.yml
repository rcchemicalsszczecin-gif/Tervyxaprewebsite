name: Finalize SEO cluster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-cluster-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add crawlable cluster links to homepage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='id="seo-cluster"'
          if marker not in s:
              block='''\n    <section id="seo-cluster" class="content-section" aria-labelledby="seo-cluster-title">\n      <div class="section-kicker">BAZA WIEDZY // SEO</div>\n      <h2 id="seo-cluster-title">Rozwiązania i wiedza o AI dla firm</h2>\n      <p class="section-intro">Rozszerzona publiczna warstwa prewebsite prowadzi do najważniejszych tematów: systemów AI, automatyzacji procesów, pracy z dokumentami, lokalnego AI i praktycznej bazy wiedzy.</p>\n      <div class="fit-grid">\n        <a class="fit-item" href="/systemy-ai-dla-firm/"><strong>Systemy AI dla firm</strong><span>AI, RAG, dokumenty, dane i integracje.</span></a>\n        <a class="fit-item" href="/automatyzacja-procesow/"><strong>Automatyzacja procesów</strong><span>Workflow, API, dane i kontrola.</span></a>\n        <a class="fit-item" href="/ai-do-dokumentow/"><strong>AI do dokumentów</strong><span>Klasyfikacja, wyszukiwanie i baza wiedzy.</span></a>\n        <a class="fit-item" href="/lokalne-ai-dla-firm/"><strong>Lokalne AI dla firm</strong><span>On-premise, prywatność i CPU/GPU.</span></a>\n        <a class="fit-item" href="/wiedza/"><strong>Baza wiedzy Tervyxa</strong><span>10 praktycznych materiałów o AI i automatyzacji.</span></a>\n      </div>\n    </section>\n'''
              if '</main>' not in s:
                  raise SystemExit('STOP: missing </main>')
              s=s.replace('</main>', block+'</main>', 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'Tervyxa Systems Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'seo: link topical cluster from homepage'
            git push origin HEAD:main
          fi
      - name: Submit canonical URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          KEY='1fac488a605d166e281f2e07a72e0957'
          KEY_LOCATION='https://tervyxa.pl/1fac488a605d166e281f2e07a72e0957.txt'
          URLS=(
            'https://tervyxa.pl/'
            'https://tervyxa.pl/systemy-ai-dla-firm/'
            'https://tervyxa.pl/automatyzacja-procesow/'
            'https://tervyxa.pl/ai-do-dokumentow/'
            'https://tervyxa.pl/lokalne-ai-dla-firm/'
            'https://tervyxa.pl/wiedza/'
            'https://tervyxa.pl/wiedza/jak-wdrozyc-ai-w-firmie/'
            'https://tervyxa.pl/wiedza/lokalne-ai-czy-chmura/'
            'https://tervyxa.pl/wiedza/automatyzacja-dokumentow-ai/'
            'https://tervyxa.pl/wiedza/czym-jest-rag/'
            'https://tervyxa.pl/wiedza/ai-w-malej-firmie/'
            'https://tervyxa.pl/wiedza/integracja-ai-z-systemami/'
            'https://tervyxa.pl/wiedza/prywatne-ai-dla-firm/'
            'https://tervyxa.pl/wiedza/infrastruktura-ai-cpu-gpu/'
            'https://tervyxa.pl/wiedza/dedykowane-oprogramowanie-kiedy/'
            'https://tervyxa.pl/wiedza/automatyzacja-procesow-od-czego-zaczac/'
          )
          for URL in "${URLS[@]}"; do
            CODE="$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' --get 'https://www.bing.com/indexnow' --data-urlencode "url=${URL}" --data-urlencode "key=${KEY}" --data-urlencode "keyLocation=${KEY_LOCATION}")"
            echo "${URL} -> HTTP ${CODE}"
            test "${CODE}" = '200' -o "${CODE}" = '202'
          done
