name: SEO Authority v3 rebuild

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-authority-v3.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tooling
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

      - name: Generate responsive hero assets
        shell: bash
        run: |
          set -euo pipefail
          SRC='assets/tervyxa-hero-8k.png'
          test -f "$SRC"
          for W in 640 1280 1920 2560; do
            convert "$SRC" -resize "${W}x" -strip -quality 82 -define webp:method=6 "assets/tervyxa-hero-${W}.webp"
          done
          convert "$SRC" -resize '1200x630^' -gravity center -extent 1200x630 -strip -quality 88 'assets/tervyxa-og-1200.jpg'
          ls -lh assets/tervyxa-hero-*.webp assets/tervyxa-og-1200.jpg

      - name: Rebuild trust, authority and content layers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json, html
          from datetime import date

          ROOT=Path('.')
          TODAY='2026-08-11'

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s):
              p=Path(p); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(s,encoding='utf-8')

          # ---- Homepage performance + trust links ----
          p=Path('index.html'); s=read(p)
          old_preload='<link rel="preload" href="assets/tervyxa-hero-8k.png" as="image" type="image/png" fetchpriority="high">'
          new_preload='<link rel="preload" as="image" href="assets/tervyxa-hero-1920.webp" type="image/webp" imagesrcset="assets/tervyxa-hero-640.webp 640w, assets/tervyxa-hero-1280.webp 1280w, assets/tervyxa-hero-1920.webp 1920w, assets/tervyxa-hero-2560.webp 2560w" imagesizes="100vw" fetchpriority="high">'
          s=s.replace(old_preload,new_preload)
          old_img='<img class="hero-image" src="assets/tervyxa-hero-8k.png" width="7680" height="4320" alt="Tervyxa Systems — systemy AI dla firm i automatyzacja procesów" fetchpriority="high" decoding="async" draggable="false">'
          new_img='''<picture class="hero-picture">\n      <source type="image/webp" srcset="assets/tervyxa-hero-640.webp 640w, assets/tervyxa-hero-1280.webp 1280w, assets/tervyxa-hero-1920.webp 1920w, assets/tervyxa-hero-2560.webp 2560w" sizes="100vw">\n      <img class="hero-image" src="assets/tervyxa-hero-8k.png" width="7680" height="4320" alt="Tervyxa Systems — systemy AI dla firm i automatyzacja procesów" fetchpriority="high" decoding="async" draggable="false">\n    </picture>'''
          if old_img not in s: raise SystemExit('STOP homepage hero marker missing')
          s=s.replace(old_img,new_img,1)
          s=s.replace('https://tervyxa.pl/assets/tervyxa-hero-8k.png','https://tervyxa.pl/assets/tervyxa-og-1200.jpg')
          s=s.replace('<meta property="og:image:width" content="7680">','<meta property="og:image:width" content="1200">')
          s=s.replace('<meta property="og:image:height" content="4320">','<meta property="og:image:height" content="630">')
          trust='''\n    <section id="zaufanie" class="content-section" aria-labelledby="trust-title">\n      <div class="section-kicker">PUBLIC TRUST // METODOLOGIA</div>\n      <h2 id="trust-title">Treści techniczne oparte na jawnych zasadach</h2>\n      <p class="section-intro">Tervyxa Systems oddziela opis możliwości technologii od potwierdzonych wyników. Nie publikujemy fikcyjnych klientów, wdrożeń ani benchmarków. Materiały eksperckie mają wskazywać warunki, ograniczenia, ryzyka i sposób weryfikacji rozwiązania.</p>\n      <div class="fit-grid">\n        <a class="fit-item" href="/o-nas/"><strong>O Tervyxa Systems</strong><span>Publiczny zakres działalności i specjalizacja.</span></a>\n        <a class="fit-item" href="/standardy-redakcyjne/"><strong>Standardy redakcyjne</strong><span>Jak powstają i są aktualizowane materiały wiedzy.</span></a>\n        <a class="fit-item" href="/laboratorium/"><strong>Laboratorium Tervyxa</strong><span>Jak testujemy architekturę, jakość i wydajność bez wymyślania wyników.</span></a>\n        <a class="fit-item" href="/wiedza/"><strong>Baza wiedzy</strong><span>Przewodniki o AI, automatyzacji, RAG i infrastrukturze.</span></a>\n      </div>\n    </section>\n'''
          if 'id="zaufanie"' not in s:
              s=s.replace('</main>',trust+'</main>',1)
          write(p,s)

          # ---- CSS performance/trust ----
          css=read('style.css')
          if '.hero-picture{' not in css:
              css += '\n.hero-picture{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;overflow:hidden}\n.hero-picture .hero-image{position:absolute;inset:0;width:100%;height:100%}\n'
          write('style.css',css)

          cp=read('content-pages.css')
          extra='''\n.trust-box{margin:28px 0;padding:20px 22px;border:1px solid rgba(126,216,255,.16);border-radius:20px;background:rgba(5,24,43,.62)}\n.trust-box strong{display:block;margin-bottom:8px;font-size:13px;letter-spacing:.04em}\n.trust-box p{margin:0;color:rgba(218,238,248,.68);font-size:13px;line-height:1.65}\n.checklist{display:grid;gap:10px;margin:22px 0;padding:0;list-style:none}\n.checklist li{padding:13px 15px;border-left:2px solid rgba(110,220,255,.45);background:rgba(5,24,43,.4);color:rgba(230,244,251,.78);line-height:1.55}\n.related-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}\n.related-grid a{padding:16px 18px;border:1px solid rgba(126,216,255,.14);border-radius:16px;background:rgba(5,24,43,.48)}\n.related-grid strong{display:block;margin-bottom:5px;font-size:13px}.related-grid span{color:rgba(213,235,245,.6);font-size:12px;line-height:1.45}\n.note{padding:16px 18px;border:1px dashed rgba(126,216,255,.2);border-radius:16px;color:rgba(215,236,246,.66);font-size:13px;line-height:1.65}\n@media(max-width:640px){.related-grid{grid-template-columns:1fr}}\n'''
          if '.trust-box{' not in cp: cp += extra
          write('content-pages.css',cp)

          # ---- Static trust pages ----
          def page(title,desc,canonical,kicker,h1,lead,sections):
              body=''.join(f'<section class="section"><div class="wrap"><h2>{html.escape(h)}</h2>{c}</div></section>' for h,c in sections)
              return f'''<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1"><title>{html.escape(title)}</title><meta name="description" content="{html.escape(desc)}"><link rel="canonical" href="{canonical}"><link rel="stylesheet" href="/content-pages.css"><meta property="og:type" content="website"><meta property="og:locale" content="pl_PL"><meta property="og:site_name" content="Tervyxa Systems"><meta property="og:title" content="{html.escape(title)}"><meta property="og:description" content="{html.escape(desc)}"><meta property="og:url" content="{canonical}"><script type="application/ld+json">{json.dumps({"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://tervyxa.pl/#organization","name":"Tervyxa Systems","url":"https://tervyxa.pl/"},{"@type":"WebPage","url":canonical,"name":title,"description":desc,"inLanguage":"pl-PL","about":{"@id":"https://tervyxa.pl/#organization"}}]},ensure_ascii=False)}</script></head><body><header class="top"><div class="wrap"><a class="brand" href="/">TERVYXA SYSTEMS</a><nav class="nav"><a href="/systemy-ai-dla-firm/">Systemy AI</a><a href="/automatyzacja-procesow/">Automatyzacja</a><a href="/ai-do-dokumentow/">AI do dokumentów</a><a href="/lokalne-ai-dla-firm/">Lokalne AI</a><a href="/wiedza/">Wiedza</a></nav></div></header><main><section class="hero"><div class="wrap"><div class="breadcrumbs"><a href="/">Tervyxa Systems</a> / {html.escape(h1)}</div><div class="kicker">{html.escape(kicker)}</div><h1>{html.escape(h1)}</h1><p>{html.escape(lead)}</p></div></section>{body}<section class="section"><div class="wrap"><div class="cta"><div><div class="kicker">TERVYXA SYSTEMS</div><h2>Powiązane materiały</h2><p>Przejdź do bazy wiedzy lub stron filarowych, aby zobaczyć techniczne rozwinięcie tematów.</p></div><a href="/wiedza/">Baza wiedzy</a></div></div></section></main><footer class="footer"><div class="wrap">© 2026 Tervyxa Systems · oficjalny serwis: tervyxa.pl</div></footer></body></html>'''

          write('o-nas/index.html', page('O Tervyxa Systems | AI, automatyzacja i infrastruktura','Publiczny opis Tervyxa Systems, zakresu działalności i sposobu projektowania systemów AI i automatyzacji.','https://tervyxa.pl/o-nas/','PUBLIC TRUTH','O Tervyxa Systems','Tervyxa Systems rozwija systemy AI dla firm, automatyzację procesów, dedykowane oprogramowanie, integracje i infrastrukturę technologiczną.',[
              ('Zakres działalności','<p>Publiczny zakres Tervyxa Systems obejmuje systemy AI, automatyzację procesów biznesowych, dedykowane oprogramowanie, integracje API, pracę z dokumentami i wiedzą oraz infrastrukturę dla obciążeń AI.</p><p>W komunikacji oddzielamy opis możliwości technologicznych od potwierdzonych wdrożeń. Nie publikujemy fikcyjnych klientów, wyników ani statystyk.</p>'),
              ('Jak projektujemy rozwiązania','<p>Punktem wyjścia jest proces: dane wejściowe, reguły, wyjątki, wynik i miejsca wymagające kontroli człowieka. Model AI jest jednym z komponentów architektury, obok kodu, API, danych, kolejek, logów i infrastruktury.</p>'),
              ('Publiczna wersja startowa','<p>tervyxa.pl jest obecnie publiczną warstwą startową i bazą wiedzy przed pełnym serwisem. Treści mają jasno opisywać specjalizację, metodykę i zakres rozwiązań bez tworzenia niepotwierdzonych deklaracji.</p>')]))

          write('standardy-redakcyjne/index.html', page('Standardy redakcyjne Tervyxa Systems','Zasady tworzenia, weryfikacji i aktualizacji materiałów technicznych publikowanych przez Tervyxa Systems.','https://tervyxa.pl/standardy-redakcyjne/','TRUST // EDITORIAL','Standardy redakcyjne','Materiały techniczne mają być użyteczne, sprawdzalne i wyraźnie oddzielać fakty, przykłady oraz hipotezy.',[
              ('Zasada źródła i zakresu','<p>Opisujemy to, co wynika z publicznie znanych właściwości technologii, jawnej dokumentacji albo własnej, możliwej do powtórzenia procedury testowej. Nie przypisujemy sobie klientów, wdrożeń ani wyników, których publicznie nie potwierdzono.</p>'),
              ('Aktualizacja i korekta','<p>Materiały mają datę publikacji lub aktualizacji. Gdy zmieniają się istotne parametry technologii, zalecenia albo publiczny zakres Tervyxa Systems, treść powinna zostać zaktualizowana zamiast utrzymywać nieaktualny opis.</p>'),
              ('AI w procesie tworzenia treści','<p>Narzędzia AI mogą wspierać redakcję, strukturę i analizę, ale nie zastępują weryfikacji technicznej. Odpowiedzialność za opublikowany materiał pozostaje po stronie Tervyxa Systems jako wydawcy.</p>'),
              ('Co uznajemy za dobry materiał','<ul class="checklist"><li>Wyjaśnia, kiedy dane podejście ma sens i kiedy nie.</li><li>Pokazuje ograniczenia oraz punkty kontroli.</li><li>Rozdziela dane, wnioski i przykłady.</li><li>Nie obiecuje wyniku bez warunków brzegowych.</li></ul>')]))

          write('laboratorium/index.html', page('Laboratorium Tervyxa | Metodyka testów AI i infrastruktury','Jak Tervyxa Systems podchodzi do testów modeli, RAG, automatyzacji i infrastruktury CPU/GPU bez publikowania fikcyjnych benchmarków.','https://tervyxa.pl/laboratorium/','ORIGINAL EVIDENCE','Laboratorium Tervyxa','Warstwa laboratoryjna służy do oceny jakości, stabilności, wydajności i ograniczeń systemów przed formułowaniem wniosków.',[
              ('Co mierzymy','<p>W zależności od systemu mierzymy jakość odpowiedzi, poprawność wyszukiwania, stabilność pipeline, opóźnienia, przepustowość, zużycie zasobów i zachowanie przy błędach. Metryka musi wynikać z celu procesu.</p>'),
              ('Jak wygląda procedura','<ul class="checklist"><li>Definicja hipotezy i warunku PASS/FAIL.</li><li>Stałe dane wejściowe lub opis próbki.</li><li>Kontrolowana konfiguracja modelu i infrastruktury.</li><li>Powtarzalne uruchomienia i zapis logów.</li><li>Oddzielenie wyniku testu od interpretacji.</li></ul>'),
              ('Czego nie publikujemy jako fakt','<p>Nie prezentujemy liczby jako benchmarku Tervyxa, jeżeli nie ma zachowanej konfiguracji, warunków testu i możliwości ponownego uruchomienia. Przykłady architektury są oznaczane jako przykłady, a nie jako dowód konkretnego wdrożenia klienta.</p>'),
              ('Po co ta warstwa','<p>Original evidence ma znaczenie praktyczne: pomaga dobrać architekturę do realnego procesu i pokazuje ograniczenia, których nie widać w opisach marketingowych. Publiczne wyniki będą dodawane tylko wtedy, gdy przejdą powtarzalną walidację.</p>')]))

          # ---- Deepen knowledge articles without inventing metrics ----
          expansions={
            'jak-wdrozyc-ai-w-firmie':[
              ('Jak zdefiniować sukces wdrożenia','<p>Przed wyborem modelu trzeba określić, co oznacza poprawny wynik. Może to być zgodność klasyfikacji, czas obsługi dokumentu, odsetek zadań wymagających ręcznej korekty albo kompletność odpowiedzi względem źródła. Bez kryterium akceptacji nie da się rzetelnie ocenić pilota.</p><p>Warto także zapisać warunek STOP: sytuację, w której system nie powinien podejmować dalszej akcji automatycznie i musi przekazać zadanie człowiekowi.</p>'),
              ('Najczęstsze błędy wdrożeniowe','<ul class="checklist"><li>Rozpoczynanie od modelu zamiast procesu.</li><li>Brak danych testowych reprezentujących realne wyjątki.</li><li>Brak logów i wersjonowania promptów lub konfiguracji.</li><li>Automatyczne wykonywanie krytycznych akcji bez punktu kontroli.</li><li>Brak planu kosztu i skalowania po pilotażu.</li></ul>'),
              ('Minimalna checklista przed produkcją','<p class="note">Dane wejściowe opisane → kryteria jakości ustalone → obsługa błędów zaprojektowana → uprawnienia sprawdzone → logowanie włączone → rollback lub ręczna ścieżka dostępna.</p>')],
            'lokalne-ai-czy-chmura':[
              ('Kryteria decyzji lokalnie czy chmura','<p>Najważniejsze są: wrażliwość danych, wymagane modele, opóźnienia, zmienność obciążenia, koszt utrzymania i kompetencje operacyjne. Lokalne AI daje większą kontrolę nad środowiskiem, ale przenosi odpowiedzialność za aktualizacje, monitoring i dostępność na organizację.</p>'),
              ('Kiedy rozwiązanie hybrydowe jest lepsze','<p>Nie trzeba wybierać wyłącznie jednej strony. Dane wrażliwe mogą być przetwarzane lokalnie, a mniej krytyczne zadania mogą korzystać z usług zewnętrznych. Warstwa routingu może wybierać model zależnie od rodzaju danych i poziomu ryzyka.</p>'),
              ('Checklista porównawcza','<ul class="checklist"><li>Klasyfikacja danych i wymogi prywatności.</li><li>Wymagany model i jego rozmiar.</li><li>Średnie i szczytowe obciążenie.</li><li>Wymagany czas odpowiedzi.</li><li>Koszt sprzętu, energii, chmury i utrzymania.</li></ul>')],
            'automatyzacja-dokumentow-ai':[
              ('Typowy pipeline dokumentowy','<p>Przepływ często obejmuje odbiór pliku, ekstrakcję tekstu, klasyfikację typu dokumentu, walidację pól, wzbogacenie danymi z systemu firmy i zapis wyniku. AI powinno być użyte tylko w etapach wymagających interpretacji; walidacje liczb, formatów i uprawnień lepiej utrzymać jako deterministyczne reguły.</p>'),
              ('Kontrola jakości','<p>Każde pole lub decyzja powinna mieć regułę weryfikacji. Przy niskiej pewności albo sprzeczności ze źródłem dokument trafia do ręcznej kontroli zamiast być automatycznie zatwierdzony.</p>'),
              ('Ryzyka','<ul class="checklist"><li>Błędny OCR lub niepełny dokument.</li><li>Zmiana układu formularza.</li><li>Brak jednoznacznego źródła prawdy.</li><li>Automatyczne księgowanie lub wysyłka bez walidacji.</li></ul>')],
            'czym-jest-rag':[
              ('RAG to system, nie pojedynczy model','<p>RAG łączy indeksowanie wiedzy, wyszukiwanie fragmentów i generowanie odpowiedzi. Jakość zależy więc nie tylko od modelu językowego, ale też od przygotowania dokumentów, chunkingu, embeddingów, wyszukiwania, rerankingu i sposobu cytowania źródeł.</p>'),
              ('Jak oceniać RAG','<p>Osobno mierzy się retrieval i generation. Najpierw trzeba sprawdzić, czy właściwy fragment znalazł się wśród wyników wyszukiwania. Dopiero potem można oceniać, czy model poprawnie wykorzystał dostarczony kontekst.</p>'),
              ('Typowe błędy','<ul class="checklist"><li>Zbyt duże lub zbyt małe fragmenty dokumentów.</li><li>Brak metadanych i filtrów uprawnień.</li><li>Ocena tylko „ładnej odpowiedzi”, bez kontroli retrieval.</li><li>Brak cytowania źródeł lub identyfikatora dokumentu.</li></ul>')],
            'ai-w-malej-firmie':[
              ('Od czego zacząć przy małym budżecie','<p>Najlepszy pierwszy przypadek użycia ma mały zakres, powtarzalne dane wejściowe i łatwy do sprawdzenia wynik. Zamiast budować własny duży system od pierwszego dnia, można zacząć od jednego workflow i dopiero po potwierdzeniu wartości rozbudować architekturę.</p>'),
              ('Co automatyzować bez AI','<p>Wiele zadań nie wymaga modelu: przenoszenie plików, walidacja formularzy, wysyłka powiadomień, synchronizacja danych czy reguły statusów są bardziej przewidywalne jako klasyczna automatyzacja.</p>'),
              ('Checklista małej firmy','<ul class="checklist"><li>Jedno źródło problemu.</li><li>Jeden właściciel procesu.</li><li>Prosty sposób pomiaru efektu.</li><li>Ręczna ścieżka awaryjna.</li><li>Koszt utrzymania po pilocie.</li></ul>')],
            'integracja-ai-z-systemami':[
              ('Wzorzec integracyjny','<p>AI najlepiej traktować jako usługę wewnątrz procesu. System źródłowy przekazuje zadanie, warstwa integracyjna przygotowuje dane i politykę dostępu, komponent AI zwraca wynik, a reguły biznesowe decydują, co zrobić dalej.</p>'),
              ('API, kolejka czy webhook','<p>Synchroniczne API pasuje do krótkich operacji wymagających natychmiastowej odpowiedzi. Kolejka jest lepsza dla zadań ciężkich i odpornych na opóźnienia. Webhook sprawdza się jako sygnał o zmianie stanu. W praktyce duże procesy często łączą wszystkie trzy mechanizmy.</p>'),
              ('Kontrola integracji','<ul class="checklist"><li>Idempotencja i identyfikator zadania.</li><li>Timeout, retry i dead-letter path.</li><li>Logowanie wejścia, wersji i wyniku.</li><li>Kontrola uprawnień do danych.</li></ul>')],
            'prywatne-ai-dla-firm':[
              ('Co znaczy prywatne AI','<p>Prywatność nie wynika wyłącznie z lokalizacji modelu. Obejmuje także logi, kopie danych, embeddingi, cache, telemetrię, konta administracyjne i sposób aktualizacji oprogramowania. Architektura powinna określać, gdzie dane mogą się pojawić na każdym etapie procesu.</p>'),
              ('Modele wdrożenia','<p>Możliwe są środowiska całkowicie lokalne, prywatna chmura, infrastruktura dedykowana oraz wariant hybrydowy. Wybór zależy od klasy danych, skali obciążenia i dostępności kompetencji operacyjnych.</p>'),
              ('Checklista prywatności','<ul class="checklist"><li>Mapa przepływu danych.</li><li>Uprawnienia i segmentacja usług.</li><li>Retencja logów i kopii.</li><li>Kontrola zależności zewnętrznych.</li><li>Procedura aktualizacji i audytu.</li></ul>')],
            'infrastruktura-ai-cpu-gpu':[
              ('CPU i GPU pełnią inne role','<p>GPU przyspiesza obliczenia równoległe modeli, ale pipeline AI obejmuje też przygotowanie danych, sieć, storage, kolejki, indeksowanie i logowanie. Wąskie gardło może znajdować się poza GPU, dlatego infrastruktury nie należy oceniać wyłącznie liczbą kart.</p>'),
              ('Co mierzyć przy doborze sprzętu','<p>Znaczenie mają rozmiar modelu, VRAM, przepustowość pamięci, długość kontekstu, wielkość batcha, charakter obciążenia i wymagany czas odpowiedzi. Dla zadań batchowych priorytety mogą być inne niż dla interaktywnego API.</p>'),
              ('Warunki stabilnego testu','<ul class="checklist"><li>Stała wersja sterownika i runtime.</li><li>Jawna konfiguracja modelu.</li><li>Temperatury i limity mocy pod kontrolą.</li><li>Powtarzalne dane wejściowe.</li><li>Zapis błędów i czasu wykonania.</li></ul>')],
            'dedykowane-oprogramowanie-kiedy':[
              ('Kiedy własny system ma sens','<p>Dedykowane oprogramowanie jest uzasadnione, gdy proces daje firmie przewagę, gotowe narzędzia wymuszają wiele obejść albo trzeba połączyć kilka źródeł danych i automatyzacji w jeden kontrolowany interfejs.</p>'),
              ('Kiedy nie budować','<p>Jeżeli proces jest standardowy i dobrze obsługiwany przez dojrzały SaaS, własny system może tylko zwiększyć koszt utrzymania. Warto najpierw sprawdzić konfigurację gotowych narzędzi i koszt integracji.</p>'),
              ('Koszt całego cyklu życia','<ul class="checklist"><li>Budowa i testy.</li><li>Hosting i monitoring.</li><li>Aktualizacje zależności.</li><li>Wsparcie użytkowników.</li><li>Rozwój wraz ze zmianą procesu.</li></ul>')],
            'automatyzacja-procesow-od-czego-zaczac':[
              ('Mapa procesu przed automatyzacją','<p>Najpierw zapisuje się trigger, kolejne kroki, źródła danych, wyjątki i właściciela decyzji. Dopiero wtedy widać, które operacje są deterministyczne, które wymagają AI, a które powinny pozostać ręczne.</p>'),
              ('Nie automatyzuj chaosu','<p>Jeżeli proces ma niejasne reguły i każdy pracownik wykonuje go inaczej, automatyzacja utrwali problemy. Przed implementacją trzeba ujednolicić minimalny standard wejścia i oczekiwanego wyniku.</p>'),
              ('Pierwszy workflow','<ul class="checklist"><li>Ma ograniczony zakres.</li><li>Ma mierzalny rezultat.</li><li>Ma czytelny stan i log.</li><li>Obsługuje retry i błąd.</li><li>Może zostać zatrzymany bez utraty danych.</li></ul>')]
          }

          def inject_article(path,slug):
              s=read(path)
              if 'id="authority-v3"' in s: return
              blocks=expansions.get(slug,[])
              body=''.join(f'<section class="section authority-v3" id="authority-v3"><div class="wrap"><h2>{html.escape(h)}</h2>{c}</div></section>' if i==0 else f'<section class="section authority-v3"><div class="wrap"><h2>{html.escape(h)}</h2>{c}</div></section>' for i,(h,c) in enumerate(blocks))
              trust='<section class="section"><div class="wrap"><div class="trust-box"><strong>Autor i standard publikacji: Tervyxa Systems</strong><p>Materiał ma charakter techniczno-edukacyjny. Oddziela przykłady architektury od potwierdzonych wyników i nie przedstawia fikcyjnych wdrożeń. <a href="/standardy-redakcyjne/">Zobacz standardy redakcyjne</a> oraz <a href="/laboratorium/">metodykę Laboratorium Tervyxa</a>.</p></div></div></section>'
              related='<section class="section"><div class="wrap"><h2>Powiązane tematy</h2><div class="related-grid"><a href="/systemy-ai-dla-firm/"><strong>Systemy AI dla firm</strong><span>Architektura modeli, danych i procesów.</span></a><a href="/automatyzacja-procesow/"><strong>Automatyzacja procesów</strong><span>Workflow, API, retry i kontrola.</span></a><a href="/ai-do-dokumentow/"><strong>AI do dokumentów</strong><span>RAG, klasyfikacja i wiedza firmowa.</span></a><a href="/lokalne-ai-dla-firm/"><strong>Lokalne AI</strong><span>Prywatność i infrastruktura CPU/GPU.</span></a></div></div></section>'
              marker='<section class="section"><div class="wrap"><div class="cta">'
              pos=s.find(marker)
              insert=body+trust+related
              if pos!=-1: s=s[:pos]+insert+s[pos:]
              else: s=s.replace('</main>',insert+'</main>',1)
              write(path,s)

          for slug in expansions:
              path=Path('wiedza')/slug/'index.html'
              if not path.exists(): raise SystemExit(f'STOP missing article {path}')
              inject_article(path,slug)

          # ---- Add trust navigation to knowledge hub ----
          wp=Path('wiedza/index.html'); ws=read(wp)
          if '/standardy-redakcyjne/' not in ws:
              block='<section class="section"><div class="wrap"><h2>Jak powstaje ta baza wiedzy</h2><div class="related-grid"><a href="/o-nas/"><strong>O Tervyxa Systems</strong><span>Zakres i public truth.</span></a><a href="/standardy-redakcyjne/"><strong>Standardy redakcyjne</strong><span>Weryfikacja i aktualizacja treści.</span></a><a href="/laboratorium/"><strong>Laboratorium Tervyxa</strong><span>Metodyka testów i original evidence.</span></a></div></div></section>'
              ws=ws.replace('</main>',block+'</main>',1)
          write(wp,ws)

          # ---- Sitemap ----
          urls=[
            '/', '/systemy-ai-dla-firm/','/automatyzacja-procesow/','/ai-do-dokumentow/','/lokalne-ai-dla-firm/',
            '/o-nas/','/standardy-redakcyjne/','/laboratorium/','/wiedza/'
          ]+[f'/wiedza/{x}/' for x in expansions]
          xml='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' + ''.join(f'  <url><loc>https://tervyxa.pl{u}</loc><lastmod>{TODAY}</lastmod></url>\n' for u in urls) + '</urlset>\n'
          write('sitemap.xml',xml)

          # ---- README checkpoint ----
          r=read('README.md')
          checkpoint='''\n\n## SEO Authority Upgrade v3 — checkpoint 2026-08-11\n- responsive hero WebP: 640 / 1280 / 1920 / 2560 px, z zachowaniem 8K PNG jako master/fallback,\n- osobny OG image 1200×630,\n- trust layer: `/o-nas/`, `/standardy-redakcyjne/`, `/laboratorium/`,\n- 10 artykułów wiedzy rozszerzonych o kryteria decyzji, ograniczenia, checklisty i kontrolę jakości,\n- jawna polityka: brak fikcyjnych klientów, wdrożeń i benchmarków,\n- wewnętrzne linkowanie między artykułami, filarami i stronami trust,\n- sitemap rozszerzona o pełny klaster v3.\n'''
          if 'SEO Authority Upgrade v3' not in r: r+=checkpoint
          write('README.md',r)
          PY

      - name: Validate rebuilt site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re, xml.etree.ElementTree as ET

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.h1=0; self.links=[]; self.canon=[]; self.scripts=[]; self._json=False; self._buf=''
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='h1': self.h1+=1
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
                  if tag=='link' and a.get('rel')=='canonical': self.canon.append(a.get('href'))
                  if tag=='script' and a.get('type')=='application/ld+json': self._json=True; self._buf=''
              def handle_data(self,d):
                  if self._json: self._buf+=d
              def handle_endtag(self,tag):
                  if tag=='script' and self._json:
                      self.scripts.append(self._buf); self._json=False

          files=[p for p in Path('.').rglob('index.html') if '.git' not in p.parts]
          assert files, 'no html files'
          for f in files:
              p=P(); p.feed(f.read_text(encoding='utf-8'))
              assert p.h1==1, f'{f}: h1={p.h1}'
              assert len(p.canon)==1 and p.canon[0].startswith('https://tervyxa.pl/'), f'{f}: canonical'
              for raw in p.scripts:
                  json.loads(raw)
              for href in p.links:
                  if not href.startswith('/') or href.startswith('//') or href.startswith('/#'): continue
                  path=href.split('#')[0].split('?')[0]
                  if path=='/': target=Path('index.html')
                  elif path.endswith('/'): target=Path(path.lstrip('/'))/'index.html'
                  else: continue
                  assert target.exists(), f'{f}: broken {href} -> {target}'
          ET.parse('sitemap.xml')
          for img in ['assets/tervyxa-hero-640.webp','assets/tervyxa-hero-1280.webp','assets/tervyxa-hero-1920.webp','assets/tervyxa-hero-2560.webp','assets/tervyxa-og-1200.jpg']:
              p=Path(img); assert p.exists() and p.stat().st_size>1000, img
          homepage=Path('index.html').read_text(encoding='utf-8')
          assert '<picture class="hero-picture">' in homepage
          assert '/standardy-redakcyjne/' in homepage and '/laboratorium/' in homepage
          assert len(list(Path('wiedza').glob('*/index.html')))>=10
          print('VALIDATION_PASS')
          print('HTML_FILES',len(files))
          print('KNOWLEDGE_ARTICLES',len(list(Path('wiedza').glob('*/index.html'))))
          PY

